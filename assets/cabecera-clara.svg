<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Héctor Oyogo · Sistemas, backend e IA aplicada</title>
  <desc id="desc">Estudiante de 2º de DAM en España que opera su propio servidor Linux 24/7. Busca prácticas de DAM y empleo junior.</desc>
  <defs>
    <pattern id="puntos" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#0a0a0b" opacity="0.08"/>
    </pattern>
    <radialGradient id="brillo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 40) scale(620 360)">
      <stop offset="0" stop-color="#c6f432" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#c6f432" stop-opacity="0"/>
    </radialGradient>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0a0a0b" flood-opacity="0.18"/>
    </filter>
    <clipPath id="marco"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#marco)">
    <rect width="1200" height="320" fill="#fafafa"/>
    <rect width="1200" height="320" fill="url(#puntos)"/>
    <rect width="1200" height="320" fill="url(#brillo)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="19.5" fill="none" stroke="#0a0a0b" stroke-opacity="0.08"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="64" y="52" width="338" height="32" rx="16" fill="#c6f432"/>
    <circle cx="84" cy="68" r="4.5" fill="#0a0a0b">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="98" y="73" font-size="14" font-weight="600" fill="#0a0a0b">Busco prácticas de DAM y empleo junior</text>

    <text x="62" y="162" font-size="66" font-weight="700" letter-spacing="-1.5" fill="#0a0a0b">Héctor Oyogo</text>
    <text x="64" y="208" font-size="26" fill="#52525b">Sistemas, backend e <tspan fill="#4d7c0f" font-weight="600">IA aplicada</tspan></text>
  </g>
  <text x="64" y="262" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="15" fill="#71717a">2º DAM · España · Linux · Docker · Python · Kotlin</text>

  <g filter="url(#sombra)">
    <rect x="684" y="40" width="468" height="244" rx="14" fill="#121215"/>
  </g>
  <g>
    <path d="M684 54a14 14 0 0 1 14-14h440a14 14 0 0 1 14 14v20H684z" fill="#1b1b20"/>
    <line x1="684" y1="74" x2="1152" y2="74" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="706" cy="57" r="5.5" fill="#ff5f57"/>
    <circle cx="726" cy="57" r="5.5" fill="#febc2e"/>
    <circle cx="746" cy="57" r="5.5" fill="#28c840"/>
    <text x="918" y="61" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="12" fill="#80808a">homelab — bash</text>

    <g font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="14">
      <text x="708" y="102" fill="#ededef"><tspan fill="#c6f432">$</tspan> whoami</text>
      <text x="708" y="126" fill="#a1a1aa">héctor · 2º DAM · España</text>
      <text x="708" y="154" fill="#ededef"><tspan fill="#c6f432">$</tspan> cat homelab/README</text>
      <text x="708" y="178" fill="#a1a1aa">servidor Linux 24/7 desde septiembre de 2026</text>
      <text x="708" y="202" fill="#a1a1aa">0 puertos abiertos a Internet</text>
      <text x="708" y="230" fill="#ededef"><tspan fill="#c6f432">$</tspan> cat método.txt</text>
      <text x="708" y="254" fill="#a1a1aa">yo decido · la IA programa · las pruebas mandan</text>
      <text x="708" y="276" fill="#c6f432">$</text>
    </g>
    <rect x="724" y="264" width="9" height="16" fill="#c6f432">
      <animate attributeName="opacity" values="1;0" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
